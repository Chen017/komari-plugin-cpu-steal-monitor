name: Release On Version Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpu-steal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish installable Komari plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Decide whether a release is required
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('komari-plugin.json', 'utf8'));
          const script = readFileSync('script.js', 'utf8');
          const version = String(pkg.version);
          const match = script.match(/\bconst\s+VERSION\s*=\s*['"]([^'"]+)['"]/);

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) ||
              manifest.version !== version || match?.[1] !== version) {
            throw new Error('Release version mismatch (package.json, komari-plugin.json and script.js must match)');
          }
          const tag = 'v' + version;
          const before = process.env.BEFORE_SHA || '';
          let oldVersion = null;
          if (/^[0-9a-f]{40}$/.test(before) && !/^0+$/.test(before)) {
            try {
              oldVersion = JSON.parse(execFileSync('git', ['show', before + ':package.json'], { encoding: 'utf8' })).version;
            } catch {}
          }

          // Publish the current version once when no release exists yet;
          // subsequent commits with the same version do not republish.
          let releaseExists = false;
          try {
            execFileSync('gh', ['release', 'view', tag, '--repo', process.env.GITHUB_REPOSITORY], {
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'], env: process.env
            });
            releaseExists = true;
          } catch {}
          let tagSha = null;
          try {
            tagSha = execFileSync('git', ['rev-list', '-n', '1', 'refs/tags/' + tag], { encoding: 'utf8' }).trim();
          } catch {}

          const shouldRelease = !releaseExists;
          if (shouldRelease && tagSha && tagSha !== process.env.GITHUB_SHA) {
            throw new Error(tag + ' exists on another commit; refusing to republish from a different revision');
          }
          console.error('Version: ' + version + ', previous: ' + oldVersion +
            ', release exists: ' + releaseExists + ', release required: ' + shouldRelease);
          console.log('version=' + version);
          console.log('release_tag=' + tag);
          console.log('publish=' + shouldRelease);
          console.log('tag_exists=' + Boolean(tagSha));
          NODE

      - name: Skip when version is already released
        if: steps.version.outputs.publish != 'true'
        run: echo "A release for this version already exists; no new release will be created."

      - name: Run tests and verify the installable ZIP
        if: steps.version.outputs.publish == 'true'
        run: npm run verify

      - name: Create version tag
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.tag_exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release with installable ZIP
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            cpu-steal-monitor.zip
